defaultMarkdownHandler = "goldmark"

[goldmark]
  [goldmark.extensions]
    linkify = false
  [goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = "github"
    # Lets render-image.html wrap standalone images in <figure>
    wrapStandAloneImageWithinParagraph = false
    [goldmark.parser.attribute]
      block = true
      title = true
  [goldmark.renderer]
    unsafe = true

# Colours come from assets/css/syntax.css (generated, see the header of that file)
[highlight]
  codeFences = true
  guessSyntax = false
  lineNos = false
  lineNumbersInTable = false
  noClasses = false
  tabWidth = 2

[tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2
