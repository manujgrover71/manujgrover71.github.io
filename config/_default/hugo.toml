title = "Manuj Grover"
baseurl = "http://localhost/"
disableAliases = true
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableRobotsTXT = true
languageCode = "en-US"
summaryLength = 20

copyright = "Copyright (c) 2024-2026 Manuj Grover"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"

[minify.tdewolff.html]
  keepWhitespace = false

[imaging]
  anchor = "Center"
  hint = "photo"
  quality = 85
  resampleFilter = "Lanczos"

[services.rss]
  limit = 20

# Feeds publish as feed.xml (e.g. /blog/feed.xml) rather than the default index.xml
[outputFormats.rss]
  baseName = "feed"
