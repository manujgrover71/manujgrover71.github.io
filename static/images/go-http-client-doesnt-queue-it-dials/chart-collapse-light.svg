<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-labelledby="t d"><title id="t">Default transport against 128 idle per host at 3,200 requests a second</title><desc id="d">A caller limited to one CPU sends 3,200 requests a second for 20 seconds to a server that takes 20 ms. With DefaultTransport, in-flight requests and open connections run away after about eight seconds and the caller stays throttled; the empty stretch is where it was too throttled to record samples. With 128 idle per host, nothing moves. One run of each.</desc>
