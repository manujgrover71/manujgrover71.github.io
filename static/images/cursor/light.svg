<!-- Cursor for the light theme. Arrow from Feather's mouse-pointer icon (MIT). Hotspot 3 3 (set in main.css). -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="1.4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" fill="rgba(0,0,0,0.9)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" filter="url(#shadow)"/>
</svg>
