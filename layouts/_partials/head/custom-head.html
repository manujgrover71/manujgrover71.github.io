<!-- Custom head -->
<style>
  /* themed-img: Doks resolves "auto" to a concrete value on <html data-bs-theme>,
     so keying on that alone covers both the toggle and the OS preference. */
  .themed-img--light { display: inline; }
  .themed-img--dark  { display: none; }

  html[data-bs-theme="dark"] .themed-img--light { display: none; }
  html[data-bs-theme="dark"] .themed-img--dark  { display: inline; }

  .themed-img { max-width: 100%; height: auto; }
</style>
